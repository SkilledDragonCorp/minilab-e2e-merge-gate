<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkilledDragon Checkout Fixture (Broken)</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #020617;
        --navy: #040f49;
        --blue: #006bdf;
        --bg: #f4f7fb;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(160deg, var(--bg), #e8eef8 55%, #f8e8e8);
        color: var(--ink);
        min-height: 100vh;
      }
      main {
        max-width: 28rem;
        margin: 3rem auto;
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.4rem;
        color: var(--navy);
        margin: 0 0 1rem;
      }
      label {
        display: block;
        margin: 0.75rem 0 0.25rem;
        font-weight: 600;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 0.6rem 0.7rem;
        border: 1px solid #c5d0e0;
        border-radius: 0.35rem;
      }
      button {
        margin-top: 1rem;
        width: 100%;
        padding: 0.7rem 1rem;
        border: 0;
        border-radius: 0.35rem;
        background: var(--blue);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: var(--navy);
      }
      #status {
        margin-top: 1rem;
        min-height: 1.25rem;
      }
      .hidden {
        display: none;
      }
      .card {
        background: white;
        border: 1px solid #d5deea;
        border-radius: 0.5rem;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Dragon Merch Checkout</h1>
      <section id="login" class="card" aria-label="Login">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" />
        <button id="login-btn" type="button">Sign in</button>
      </section>
      <section id="shop" class="card hidden" aria-label="Shop">
        <p>Dragon Sticker Pack — $9</p>
        <button id="add-btn" type="button" class="secondary">Add to cart</button>
        <p id="cart" role="status" aria-label="Cart">Cart empty</p>
        <!-- Simulated bad agent change: Confirm order control removed -->
      </section>
      <p id="status" role="status" aria-label="Checkout status"></p>
    </main>
    <script type="module" src="/app.ts"></script>
  </body>
</html>
